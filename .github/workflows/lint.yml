name: Lint

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning forward-fix/run.sh forward-fix/lib.sh

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Lint YAML
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: {max: 120}, document-start: disable}}" \
            repository.yaml forward-fix/config.yaml forward-fix/build.yaml \
            .github/workflows/ .github/dependabot.yml

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: forward-fix/Dockerfile

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BATS
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/
