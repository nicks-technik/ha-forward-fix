name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: koalaman/shellcheck-py@v0.1.0
        with:
          path: forward-fix/run.sh
          severity: warning

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install yamllint
      - run: yamllint -d "{extends: default, rules: {line-length: {max: 120}, document-start: disable}}" repository.yaml forward-fix/config.yaml forward-fix/build.yaml .github/workflows/ .github/dependabot.yml

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: forward-fix/Dockerfile
